# Shared self-hosted n8n instance with automatic HTTPS (Caddy + Let's Encrypt).
# Colleagues just open https://<DOMAIN> in a browser — no local setup.
#
# Prerequisites (see deploy/README.md):
#   - a server with Docker + Docker Compose
#   - a domain/subdomain with a DNS A record pointing to the server IP
#   - ports 80 and 443 open
#
# Usage:
#   cp .env.example .env   # then edit DOMAIN
#   docker compose up -d

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${DOMAIN}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${TZ:-Europe/Paris}
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - '5678'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
